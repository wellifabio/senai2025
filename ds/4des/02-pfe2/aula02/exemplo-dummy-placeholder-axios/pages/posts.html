<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Login Posts</title>
</head>

<body>
    <header>
        <h1>Posts</h1>
        <button onclick="sair()">Sair</button>
    </header>
    <main></main>
    <footer>
        <input type="text" id="search" onkeyup="searchPosts(this.value)" placeholder="Pesquisar post..." />
    </footer>
    <section id="modal" class="modal oculto">
        <div class="janela">
            <h2>Comentários do Post</h2>
            <hr>
            <div id="post-details"></div>
            <button onclick="modal.classList.add('oculto')">Fechar</button>
        </div>
    </section>
</body>
<script src="../scripts/posts.js"></script>
<script src="../scripts/placeholder.js" type="module"></script>
<script>
    function searchPosts(searchTerm) {
        const posts = document.querySelectorAll('.post');
        posts.forEach(post => {
            const title = post.querySelector('h2').innerText.toLowerCase();
            if (title.includes(searchTerm.toLowerCase())) {
                post.style.display = '';
            } else {
                post.style.display = 'none';
            }
        });
    }
</script>

</html>
